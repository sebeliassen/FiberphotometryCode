[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberphotometry-suite"
version = "0.2.0"
description = "Multi-camera posture tracking, Keypoint-MoSeq behavioral segmentation, and fiber photometry analysis suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Gether Laboratory", email = "gether-lab@sund.ku.dk" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "h5py>=3.6.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",
    "tables>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout",
    "scikit-learn>=1.1",
    "pillow>=9.0",
    "opencv-python-headless>=4.8",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]
lint = [
    "ruff==0.16.10",
]
typing = ["mypy>=1.10,<2", "pandas-stubs>=2.0"]
dev = [
    "pre-commit",
]
kpms = [
    "jax>=0.4.0",
    "keypoint-moseq>=0.4.0",
    "psutil>=5.9.0",
    "numba>=0.56",
    "dynamax",
    "jax-moseq",
    "tqdm",
    "scikit-learn>=1.1",
    "tables>=3.7",
]
all = [
    "jax>=0.4.0",
    "keypoint-moseq>=0.4.0",
    "psutil>=5.9.0",
    "numba>=0.56",
    "dynamax",
    "jax-moseq",
    "tqdm",
    "scikit-learn>=1.1",
    "tables>=3.7",
]

[project.scripts]
fpcode-train = "fpcode.cli.train:main"
fpcode-evaluate = "fpcode.cli.evaluate:main"
fpcode-fuse = "fpcode.cli.fuse:main"
fpcode-render = "fpcode.cli.render:main"
fpcode-export = "fpcode.cli.export:main"

[tool.setuptools.package-data]
"fpcode" = ["py.typed"]
"fpcode.compat.multiview" = ["resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpcode*"]
exclude = ["tests*", "docs*", "archive*", "_backups*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    "src",
    "compat",
    "vendor/keypoint_moseq_syll",
]
addopts = "-ra --strict-markers -m 'not gpu and not slow and not needs_data'"
markers = [
    "cpu: CPU-only tests (does not imply a short runtime)",
    "gpu: GPU-accelerated modeling, JAX, and CUDA tests",
    "slow: Long-running or heavy computational tests (> 5 seconds)",
    "needs_data: Tests requiring full empirical datasets (checkpoints, videos, or HDF5 arrays)",
]
norecursedirs = [
    "runs",
    "syllable_figs",
    "used_frames",
    "__pycache__",
    ".git",
    "_backups",
    "archive",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "_backups",
    "archive",
    "tests/runs",
    "tests/regression/test_v4_repairs.py",
    "tests/empirical/test_oft_session_full_data.py",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# Initial interface check; expand this list after each contract is annotated.
# Deliberately separate from the functional CPU CI gate until locally verified.
[tool.mypy]
files = ["src/fpcode/contracts"]
python_version = "3.10"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
