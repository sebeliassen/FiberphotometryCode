name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
          cache: pip
          cache-dependency-path: configs/environments/ci-cpu-requirements.txt
      - name: Install pinned CPU dependencies and package
        run: |
          python -m pip install -r configs/environments/ci-cpu-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Functional suite and architecture
        run: |
          make test
          make architecture
      - name: Collect empirical tests without loading data or models
        run: python -B -m pytest tests/empirical --empirical --collect-only -q -m "needs_data or gpu or slow" -p no:cacheprovider
      - name: Lint maintained code
        run: make lint
      - name: Build and inspect installed wheel outside checkout
        run: make package-check
