# ==============================================================================
# Configuration: Tandem Cohort Production Run (50 AR + 200 SLDS)
# Single Source of Truth for Hyperparameters & Pipeline Settings
# ==============================================================================

model:
  name: "tandem_cohort_118sess_50ar_200slds"
  seed: 42
  target_fps: 60

training:
  num_ar_iters: 50
  num_slds_iters: 200
  total_iters: 250
  save_every_n_iters: 25
  init_kappa: 7.5e+13
  decrease_kappa_factor: 10.0
  slds_kappa: 7.5e+12  # init_kappa / decrease_kappa_factor

paths:
  fused_dir: "syllable_generation/multiview_top_bot_experiments/fused_h5_full_cohort"
  dirty_pkl_in: "syllable_generation/data/sessions_karen_project_dirty.pkl"
  k240k_pkl_ref: "syllable_generation/data/sessions_karen_project_w_sylls_k240k.pkl"
  output_prod_pkl: "syllable_generation/multiview_top_bot_experiments/sessions_karen_project_tandem_cohort_production.pkl"
  prod_kpms_dir: "syllable_generation/multiview_top_bot_experiments/kpms_tandem_cohort_production"
  config_source: "syllable_generation/multiview_top_bot_experiments/multiview_kappa_search/project/config.yml"

data_filtering:
  presence_conf_threshold: 0.9
  min_fraction_parts: 0.4
  min_frames_per_sequence: 5

notification:
  server: "https://ntfy.sh"
  topic: "woody_videos_seb"
  default_priority: "default"
  default_tags: "robot"
