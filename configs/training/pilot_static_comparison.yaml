# configs/training/pilot_static_comparison.yaml
model_name: "pilot_static_comparison"
project_dir: "syllable_generation/multiview_top_bot_experiments/pilot_static_comparison"
data_dir: "syllable_generation/multiview_top_bot_experiments/data"
seed: 404

hyperparameters:
  num_ar_iters: 50
  num_slds_iters: 100
  total_iters: 150
  save_every_n_iters: 25
  init_kappa: 1.0e6
  decrease_kappa_factor: 10.0
  slds_kappa: 1.0e5
  target_fps: 60
  min_gap_frames: 180
  min_segment_frames: 180

keypoints:
  num_keypoints: 21
  layout: "static_21kp"
