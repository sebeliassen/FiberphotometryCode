

#==================== ANATOMY =====================#

# used to access columns in the keypoint data
bodyparts:
- nose
- left_ear_tip
- right_ear_tip
- neck
- mid_back
- mouse_center
- mid_backend
- mid_backend2
- mid_backend3
- tail_base
- left_shoulder
- left_midside
- left_hip
- right_shoulder
- right_midside
- right_hip
- head_midpoint

# determines the subset of bodyparts to use for modeling and the order in which they are represented
